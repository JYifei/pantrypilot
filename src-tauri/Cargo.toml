[package]
name = "pantrypilot"
version = "0.1.0"
description = "Local-first personal food inventory and nutrition app"
authors = ["PantryPilot contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "pantrypilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
